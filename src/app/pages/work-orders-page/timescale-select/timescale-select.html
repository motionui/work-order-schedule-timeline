<div class="timescale-select">
  <ng-select
    bindLabel="label"
    bindValue="value"
    appendTo="body"
    [items]="options"
    [searchable]="false"
    [clearable]="false"
    [(ngModel)]="selected"
  >
    <ng-template ng-label-tmp let-item="item">
      <div class="trigger">
        <span class="label">Timescale</span>
        <span class="value">{{ item.label }}</span>
      </div>
    </ng-template>
  </ng-select>
</div>
