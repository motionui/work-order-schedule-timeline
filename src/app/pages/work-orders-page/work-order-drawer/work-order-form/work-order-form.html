<section class="work-order-form">
  <form [formGroup]="formGroup" novalidate (ngSubmit)="onSubmit()">
    <header class="header">
      <hgroup class="header-group">
        <h4 class="title">Work Order Details</h4>
        <span class="description"> Specify the dates, name and status for this order </span>
      </hgroup>

      <div class="actions">
        <button type="button" class="secondary-button" aria-label="Cancel button" (click)="onClickCancel()">Cancel</button>

        <button type="submit" class="primary-button" aria-label="Submit button" [disabled]="formGroup.invalid">
          {{ formData()?.mode === 'create' ? 'Create' : 'Edit' }}
        </button>
      </div>
    </header>

    <div class="separator"></div>

    <div class="form-fields">
      <!-- Name -->
      <div class="form-field">
        <label for="name">Work Order Name</label>
        <input id="name" type="text" formControlName="name" />
      </div>

      <!-- Status -->
      <div class="form-field">
        <label for="status">Status</label>
        <ng-select
          class="status-select"
          formControlName="status"
          bindLabel="label"
          bindValue="value"
          labelForId="status"
          [items]="statusOptions"
          [searchable]="false"
          [clearable]="false"
        >
          <ng-template ng-label-tmp let-item="item">
            <app-status-badge [status]="item.value"></app-status-badge>
          </ng-template>

          <ng-template ng-option-tmp let-item="item">
            {{ item.label }}
          </ng-template>
        </ng-select>
      </div>

      <!-- End Date -->
      <div class="form-field">
        <label for="endDate">End Date</label>
        <input
          id="endDate"
          placeholder="mm.dd.yyyy"
          formControlName="endDate"
          ngbDatepicker
          #endDateDatePicker="ngbDatepicker"
          (click)="endDateDatePicker.toggle()"
        />
      </div>

      <!-- Start Date -->
      <div class="form-field">
        <label for="startDate">Start Date</label>
        <input
          id="startDate"
          placeholder="mm.dd.yyyy"
          formControlName="startDate"
          ngbDatepicker
          #startDateDatePicker="ngbDatepicker"
          (click)="startDateDatePicker.toggle()"
        />
      </div>
    </div>
  </form>
</section>
