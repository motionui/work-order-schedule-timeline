<div
  class="work-center-timeline"
  (mousemove)="onMouseMove($event)"
  (mouseleave)="onMouseLeave()"
  (click)="onTimelineClick($event)"
>
  <!-- Hover preview -->
  @if (hoverPreview(); as preview) {
    <div
      class="hover-preview custom-hand-cursor"
      ngbTooltip="Click to add dates"
      placement="top"
      [openDelay]="100"
      [closeDelay]="0"
      container="body"
      [style.left.px]="preview.left"
      [style.width.px]="preview.width"
    ></div>
  }

  <!-- Existing work orders -->
  @for (item of positionedOrders(); track item.order.docId) {
    <div class="work-order-wrapper" [style.left.px]="item.left" [style.width.px]="item.width">
      <app-work-order [workOrder]="item.order" (edit)="onEdit(item.order)" (delete)="onDelete(item.order)" />
    </div>
  }
</div>
