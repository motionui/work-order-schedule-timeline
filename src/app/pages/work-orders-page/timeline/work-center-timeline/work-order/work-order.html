<div class="work-order" [ngClass]="workOrder()?.data?.status">
  <span
    class="name truncate"
    [ngbTooltip]="workOrder()?.data?.name"
    placement="top"
    [openDelay]="650"
    [closeDelay]="50"
    container="body"
  >
    {{ workOrder()?.data?.name }}
  </span>

  <div class="status">
    <app-status-badge [status]="workOrder()?.data?.status || ''" />
    <div ngbDropdown>
      <button class="three-dots-button" ngbDropdownToggle>
        <img src="images/three-dots.svg" class="icon" />
      </button>
      <div ngbDropdownMenu>
        <button ngbDropdownItem (click)="onClickEdit()">Edit</button>
        <button ngbDropdownItem (click)="onClickDelete()">Delete</button>
      </div>
    </div>
  </div>
</div>
