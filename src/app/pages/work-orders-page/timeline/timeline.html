<section class="timeline">
  <app-timescale-select [(selected)]="zoomLevel"></app-timescale-select>

  <section class="work-orders-timeline">
    <!-- TOP LEFT -->
    <div class="work-center-header">
      <span>Work Center</span>
    </div>

    <!-- RIGHT COLUMN (single scroll container) -->
    <div class="right-column hide-scrollbar">
      <!-- HEADER -->
      <div class="timeline-header">
        <div class="timeline-header-inner">
          <app-timeline-header [timeScale]="zoomLevel()" [dateRange]="visibleDateRange()" />
        </div>
      </div>

      <!-- BODY -->
      <div class="timeline-rows">
        @for (group of workOrdersGroupByWorkCenters(); track group.workCenter.docId) {
          <div
            class="timeline-row"
            [class.hovered]="hoveredWorkCenter()?.docId === group.workCenter.docId"
            (mouseenter)="hoveredWorkCenter.set(group.workCenter)"
            (mouseleave)="hoveredWorkCenter.set(null)"
          >
            <app-work-center-timeline
              [timeScale]="zoomLevel()"
              [dateRange]="visibleDateRange()"
              [workCenter]="group.workCenter"
              [workOrders]="group.workOrders"
            />
          </div>
        }
      </div>
    </div>

    <!-- LEFT COLUMN BODY -->
    <div class="work-centers">
      @for (group of workOrdersGroupByWorkCenters(); track group.workCenter.docId) {
        <div
          class="work-center-row"
          [class.hovered]="hoveredWorkCenter()?.docId === group.workCenter.docId"
          (mouseenter)="hoveredWorkCenter.set(group.workCenter)"
          (mouseleave)="hoveredWorkCenter.set(null)"
        >
          <app-work-center [workCenter]="group.workCenter" />
        </div>
      }
    </div>
  </section>
</section>
